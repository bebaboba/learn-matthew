name: Deploy Pages

# Builds and publishes the site via GitHub Actions instead of the legacy
# Jekyll-based Pages builder, which had started failing silently on this repo.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render index.html from content.md
        run: node build.js

      # Temporary maintenance mode — remove this step to restore the built site.
      - name: Maintenance mode override
        run: |
          cat > index.html << 'EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>learnmatthew.com</title>
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <style>
            html,body{height:100%;margin:0;display:flex;align-items:center;justify-content:center;background:#0b0b0c;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
            p{font-size:1.5rem;letter-spacing:0.02em;}
          </style>
          </head>
          <body>
            <p>...be right back.</p>
          </body>
          </html>
          EOF

      - name: Assemble site output
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.obsidian' \
            --exclude='_site' \
            ./ _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
